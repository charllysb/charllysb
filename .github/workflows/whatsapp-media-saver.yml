name: whatsapp-media-saver

on:
  push:
    paths:
      - "whatsapp-media-saver/**"
      - ".github/workflows/whatsapp-media-saver.yml"
  pull_request:
    paths:
      - "whatsapp-media-saver/**"
      - ".github/workflows/whatsapp-media-saver.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-media-saver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zap-saver-debug-apk
          path: whatsapp-media-saver/app/build/outputs/apk/debug/app-debug.apk
