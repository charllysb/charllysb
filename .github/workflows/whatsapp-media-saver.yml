name: whatsapp-media-saver

on:
  push:
    paths:
      - "whatsapp-media-saver/**"
      - ".github/workflows/whatsapp-media-saver.yml"
  pull_request:
    paths:
      - "whatsapp-media-saver/**"
      - ".github/workflows/whatsapp-media-saver.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-media-saver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zap-saver-debug-apk
          path: whatsapp-media-saver/app/build/outputs/apk/debug/app-debug.apk

  release:
    # Signed bundle for Google Play. Runs only once the signing secrets exist
    # (see whatsapp-media-saver/STORE.md).
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-media-saver
    env:
      KEYSTORE_BASE64: ${{ secrets.ZAPSAVER_KEYSTORE_BASE64 }}
      ZAPSAVER_KEYSTORE_PASSWORD: ${{ secrets.ZAPSAVER_KEYSTORE_PASSWORD }}
      ZAPSAVER_KEY_ALIAS: ${{ secrets.ZAPSAVER_KEY_ALIAS }}
      ZAPSAVER_KEY_PASSWORD: ${{ secrets.ZAPSAVER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signed release bundle
        id: bundle
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Signing secrets not set; skipping the release bundle."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ZAPSAVER_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          echo "built=true" >> "$GITHUB_OUTPUT"

      - if: steps.bundle.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zap-saver-release-aab
          path: whatsapp-media-saver/app/build/outputs/bundle/release/app-release.aab
